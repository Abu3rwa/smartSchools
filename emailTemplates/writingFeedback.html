<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{{headline}}</title>
</head>
<body style="margin:0;padding:0;background-color:#f8fafc;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f8fafc;padding:8px 0;">
  <tr>
    <td align="center">
      <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:600px;background-color:#ffffff;border:1px solid #cdeae6;border-radius:14px;overflow:hidden;font-family:Montserrat,Tajawal,system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;">

        <tr>
          <td style="background-color:#0f766e;padding:22px 24px;">
            <p style="margin:0 0 10px;font-size:11px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:#ccfbf1;">{{schoolLabel}}</p>
            <h1 style="margin:0;font-size:22px;line-height:1.3;font-weight:800;color:#ffffff;">{{headline}}</h1>
            <p style="margin:8px 0 0;font-size:13px;line-height:1.5;color:#ccfbf1;">{{subhead}}</p>
          </td>
        </tr>

        <tr>
          <td style="padding:20px 24px 4px;">
            <p style="margin:0 0 6px;font-size:14px;color:#0f172a;">{{greeting}}</p>
            <p style="margin:0 0 16px;font-size:14px;line-height:1.6;color:#334155;">{{intro}}</p>

            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f0fdfa;border:1px solid #cdeae6;border-radius:12px;">
              <tr>
                <td style="padding:12px 14px;">
                  <span style="display:inline-block;padding:3px 10px;border-radius:999px;background-color:#ffffff;border:1px solid #cdeae6;font-size:11px;font-weight:700;color:#0f766e;">{{typeLabel}}</span>
                  <p dir="auto" style="margin:8px 0 2px;font-size:15px;font-weight:700;color:#0f172a;text-align:start;">{{pieceTitle}}</p>
                  <p style="margin:0;font-size:12px;color:#64748b;">{{pieceMeta}}</p>
                </td>
              </tr>
            </table>

            <p style="margin:20px 0 8px;font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:#0f766e;">{{statusLabel}}</p>
            {{!statusHtml}}

            {{!summaryBlock}}

            {{!prioritiesBlock}}

            {{!buttonHtml}}
          </td>
        </tr>

        <tr>
          <td style="padding:16px 24px 20px;border-top:1px solid #e2e8f0;text-align:center;">
            <p style="margin:0;font-size:12px;line-height:1.5;color:#94a3b8;">{{footer}}</p>
          </td>
        </tr>

      </table>
    </td>
  </tr>
</table>
</body>
</html>
