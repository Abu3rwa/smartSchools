<style>{{reportSharedStyles}}</style>

<div class="report-page">
  <div class="report-card">
    <div class="card-header">
      <div>
        <h2 class="card-title">Monthly Report - {{monthName}}</h2>
        <p class="card-meta">Student: {{studentFullName}}</p>
      </div>
      <span class="badge">Monthly</span>
    </div>

    <div class="section">
      <p class="section-subtitle">
        Subject averages for <strong>{{studentFullName}}</strong> in <strong>{{monthName}}</strong> by <strong>{{teacherName}}</strong>.
      </p>
      <div class="row-list">
        {{subjectsRows}}
      </div>
      <div class="summary-bar">
        <span>Overall Average</span>
        <span>{{overallAverage}}%</span>
      </div>
    </div>

    <div class="section">
      <p class="meta-line">Based on recorded grades for the selected month.</p>
      <p class="meta-line">khalid,</p>
      <p class="meta-line">{{schoolName}}</p>
    </div>
  </div>
</div>
