<!-- SUBJECT SECTION - Compact layout -->
<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="margin:8px 0; background:#ffffff; border-radius:4px; border:1px solid #e5e7eb; border-left:3px solid #3498db;">
  <tr>
    <td style="padding:8px 10px;">
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
        <tr>
          <td style="padding-bottom:4px; border-bottom:1px solid #eee;">
            <h2 style="margin:0 0 4px 0; color:#2c3e50; font-size:14px; font-weight:600;">{{subjectName}}</h2>
            <span style="font-size:11px; color:#6c757d;">Instructor: {{teacher}}</span>
          </td>
        </tr>
        <tr>
          <td style="padding-top:6px;">
            {{categorySections}}
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
