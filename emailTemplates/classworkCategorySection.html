<div style="margin: 6px 0; padding: 8px; background: #f8fafc; border-radius: 8px; border: 1px solid #e2e8f0;">
  <h3 style="color: #0f172a; font-size: 15px; margin: 0 0 8px 0; padding-bottom: 4px; border-bottom: 2px solid #1c70d8;">
    {{categoryName}}
  </h3>
  
  <div style="overflow-x: auto; margin-bottom: 8px;">
    <table style="width: 100%; border-collapse: collapse; font-size: 14px; min-width: 320px;">
      <thead>
        <tr style="background: #1c70d8; color: #ffffff;">
          <th style="padding: 8px 6px; border: 1px solid #155ab0; text-align: left; font-weight: 700; font-size: 13px;">Date</th>
          <th style="padding: 8px 6px; border: 1px solid #155ab0; text-align: center; font-weight: 700; font-size: 13px;">Score (/10)</th>
          <th style="padding: 8px 6px; border: 1px solid #155ab0; text-align: left; font-weight: 700; font-size: 13px;">Notes</th>
        </tr>
      </thead>
      <tbody>
        {{gradeRows}}
      </tbody>
    </table>
  </div>
  
  <!-- Category Average -->
  <div style="background: #e9f2ff; padding: 8px; border-radius: 6px; border-left: 3px solid #1c70d8; margin-top: 6px;">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <span style="color: #0f172a; font-weight: 600; font-size: 13px;">Average:</span>
      <span style="font-size: 16px; font-weight: 700; color: #1c70d8;">{{categoryAverage}}/10</span>
    </div>
  </div>
</div>
