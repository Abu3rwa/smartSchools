<!-- CATEGORY SECTION - Table-based, no flexbox -->
<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="margin:6px 0; background:#ffffff; border-radius:4px; border:1px solid #e5e7eb;">
  <tr>
    <td style="padding:6px 8px;">
      <h3 style="margin:0 0 6px 0; padding-bottom:4px; border-bottom:2px solid #3498db; color:#2c3e50; font-size:13px;">{{categoryName}}</h3>
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="border-collapse:collapse; font-size:12px; min-width:200px;">
        <thead>
          <tr style="background:#3498db; color:#ffffff;">
            <th style="padding:6px 8px; border:1px solid #2980b9; text-align:left; font-weight:600; font-size:11px;">Date</th>
            <th style="padding:6px 8px; border:1px solid #2980b9; text-align:center; font-weight:600; font-size:11px;">Score (/10)</th>
            <th style="padding:6px 8px; border:1px solid #2980b9; text-align:left; font-weight:600; font-size:11px;">Notes</th>
          </tr>
        </thead>
        <tbody>
          {{gradeRows}}
        </tbody>
      </table>
      <!-- AVERAGE ROW - Table-based -->
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="margin-top:6px;">
        <tr>
          <td style="background:#e8f4fd; padding:6px 8px; border-radius:4px; border-left:3px solid #3498db;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
              <tr>
                <td style="color:#2c3e50; font-weight:600; font-size:12px;">Average:</td>
                <td style="text-align:right; font-size:13px; font-weight:700; color:#3498db;">{{categoryAverage}}/10</td>
              </tr>
            </table>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
