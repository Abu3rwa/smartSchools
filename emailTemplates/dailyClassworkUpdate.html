<!-- START CARD - Email-safe table layout, minimal margins for Flutter embedding -->
<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="margin:0; padding:0; font-family: Arial, Helvetica, sans-serif; background:#f5f7fb;">
  <tr>
    <td style="padding:8px 12px;">
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="max-width:600px; margin:0 auto; background:#ffffff; border-radius:10px; border:1px solid #e0e4e8;">
        <!-- HEADER -->
        <tr>
          <td style="background:#12293f; color:#ffffff; padding:10px 12px; border-radius:10px 10px 0 0;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
              <tr>
                <td>
                  <h1 style="margin:0 0 4px 0; font-size:18px; font-weight:700;">{{title}}</h1>
                  <p style="margin:0; font-size:12px; opacity:0.9;">{{todayStr}}</p>
                </td>
              </tr>
            </table>
          </td>
        </tr>
        <!-- STUDENT ROW -->
        <tr>
          <td style="padding:8px 12px; border-bottom:1px solid #e5e7eb;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
              <tr>
                <td style="vertical-align:middle;">
                  <strong style="color:#2c3e50; font-size:14px;">{{studentName}}</strong>
                  <span style="color:#6c757d; font-size:12px; display:block;">{{gradeClass}}</span>
                </td>
                <td style="vertical-align:middle; text-align:right; width:1%; white-space:nowrap;">
                  <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="right" style="border:1px solid #3498db; border-radius:4px;">
                    <tr>
                      <td style="padding:4px 10px; background:#3498db; color:#ffffff; font-size:12px; font-weight:600;">Read</td>
                    </tr>
                  </table>
                </td>
              </tr>
            </table>
          </td>
        </tr>
        <!-- META CHIPS ROW -->
        <tr>
          <td style="padding:6px 12px; border-bottom:1px solid #e5e7eb;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td style="padding:4px 8px; background:#f8f9fa; border-radius:4px; font-size:11px; color:#6c757d; border:1px solid #e5e7eb;">{{todayStr}}</td>
                <td style="width:8px;"></td>
                <td style="padding:4px 8px; background:#f8f9fa; border-radius:4px; font-size:11px; color:#6c757d; border:1px solid #e5e7eb;">Sent via email</td>
              </tr>
            </table>
          </td>
        </tr>
        <!-- ACADEMIC SUMMARY -->
        <tr>
          <td style="padding:8px 12px;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
              <tr>
                <td style="padding-bottom:6px; border-bottom:2px solid #3498db;">
                  <h2 style="margin:0; color:#2c3e50; font-size:13px; font-weight:600;">Academic Summary</h2>
                </td>
              </tr>
              <tr>
                <td style="padding-top:8px;">
                  {{groupedSectionsHtml}}
                </td>
              </tr>
            </table>
          </td>
        </tr>
        <!-- FOOTER -->
        <tr>
          <td style="padding:8px 12px; background:#f8f9fa; border-radius:0 0 10px 10px; border-top:1px solid #e5e7eb;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
              <tr>
                <td>
                  <strong style="color:#2c3e50; font-size:12px;">Best regards,</strong><br/>
                  <strong style="color:#2c3e50; font-size:12px;">{{teacherFirstName}}</strong><br/>
                  <span style="color:#6c757d; font-size:11px;">{{teacherEmail}}</span>
                </td>
              </tr>
            </table>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
