<tr style="background: {{bgColor}};">
  <td style="padding:6px 8px; border:1px solid #dee2e6; font-size:12px;">{{gradeDate}}</td>
  <td style="padding:6px 8px; border:1px solid #dee2e6; text-align:center; font-size:12px;">
    <span style="color: {{gradeColor}}; font-weight:bold; font-size:13px;">{{outOfTen}}/10</span><br/>
    <span style="color:#6c757d; font-size:10px;">({{marks}}/{{maxMarks}})</span>
  </td>
  <td style="padding:6px 8px; border:1px solid #dee2e6; font-style:italic; color:#555; font-size:12px;">{{notes}}</td>
</tr>
