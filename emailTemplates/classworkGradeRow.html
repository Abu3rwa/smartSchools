<tr style="background: {{bgColor}};">
  <td style="padding: 8px 6px; border: 1px solid #e2e8f0; font-size: 13px; color: #0f172a;">{{gradeDate}}</td>
  <td style="padding: 8px 6px; border: 1px solid #e2e8f0; text-align: center; font-size: 13px;">
    <div style="color: {{gradeColor}}; font-weight: 700; font-size: 16px;">{{outOfTen}}/10</div>
    <div style="color: #64748b; font-size: 12px;">({{marks}}/{{maxMarks}})</div>
  </td>
  <td style="padding: 8px 6px; border: 1px solid #e2e8f0; font-style: italic; color: #334155; font-size: 13px; max-width: 160px; word-wrap: break-word; word-break: break-word;">
    {{notes}}
  </td>
</tr>
