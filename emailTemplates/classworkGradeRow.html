<tr style="background: {{bgColor}};">
  <td style="padding: 8px 6px; border: 1px solid #e2e8f0; font-size: 12px; color: #0f172a; word-break: break-word;">{{gradeDate}}</td>
  <td style="padding: 8px 6px; border: 1px solid #e2e8f0; text-align: center; font-size: 12px; word-break: break-word;">
    <div style="color: #0f172a; font-weight: 700; font-size: 14px;">{{outOfTen}}/10</div>
    <div style="color: #64748b; font-size: 11px;">({{marks}}/{{maxMarks}})</div>
  </td>
  <td style="padding: 8px 6px; border: 1px solid #e2e8f0; color: #334155; font-size: 12px; word-wrap: break-word; word-break: break-word;">
    {{notes}}
  </td>
</tr>
