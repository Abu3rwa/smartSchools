<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{{headlineEn}}</title>
</head>
<body style="margin:0;padding:0;background-color:#f8fafc;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f8fafc;padding:8px 0;">
  <tr>
    <td align="center">
      <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:600px;background-color:#ffffff;border:1px solid #e2e8f0;border-radius:14px;overflow:hidden;font-family:Montserrat,Tajawal,system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;">
        <tr>
          <td style="background-color:#0f766e;padding:22px 24px;">
            <p style="margin:0 0 10px;font-size:11px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:#ccfbf1;">{{schoolName}}</p>
            <h1 style="margin:0;font-size:22px;line-height:1.3;font-weight:800;color:#ffffff;">{{headlineEn}}</h1>
            <p style="margin:6px 0 0;font-size:16px;line-height:1.6;color:#ccfbf1;direction:rtl;text-align:right;">{{headlineAr}}</p>
          </td>
        </tr>
        <tr>
          <td style="padding:22px 24px 8px;">
            <p style="margin:0 0 12px;font-size:14px;line-height:1.7;color:#334155;">{{introEn}}</p>
            <p style="margin:0 0 18px;font-size:14px;line-height:1.8;color:#334155;direction:rtl;text-align:right;">{{introAr}}</p>

            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f0fdfa;border:1px solid #cdeae6;border-radius:12px;margin-bottom:18px;">
              <tr>
                <td style="padding:14px 16px;">
                  <p style="margin:0 0 4px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:#0f766e;">{{studentLabelEn}}</p>
                  <p style="margin:0;font-size:16px;font-weight:700;color:#0f172a;">{{studentName}}</p>
                  <p style="margin:8px 0 0;font-size:13px;color:#475569;">{{detailLine}}</p>
                  <p style="margin:6px 0 0;font-size:13px;color:#475569;">{{dueLine}}</p>
                </td>
              </tr>
            </table>

            {{!codeBlock}}
            {{!urlBlock}}

            <p style="margin:0 0 6px;font-size:12px;line-height:1.6;color:#64748b;">{{footerEn}}</p>
            <p style="margin:0;font-size:12px;line-height:1.7;color:#64748b;direction:rtl;text-align:right;">{{footerAr}}</p>
          </td>
        </tr>
        <tr>
          <td style="padding:16px 24px 22px;border-top:1px solid #e2e8f0;">
            <p style="margin:0;font-size:12px;color:#94a3b8;">{{schoolName}} · {{academicYear}}</p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
