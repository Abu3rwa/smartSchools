<style>{{reportSharedStyles}}</style>

<div class="report-page">
  <div class="report-card">
    <div class="card-header">
      <div>
        <h2 class="card-title">Daily Report</h2>
        <p class="card-meta">{{prettyDate}}</p>
      </div>
      <span class="badge">Daily</span>
    </div>

    <div class="section">
      <p class="card-meta">Dear {{studentFirstName}}'s Parent,</p>
      <p class="section-subtitle">
        Here is today's performance summary for <strong>{{studentFullName}}</strong> by <strong>{{teacherName}}</strong>.
      </p>
      <div class="row-list">
        {{gradesRows}}
      </div>
    </div>

    <div class="section">
      <p class="meta-line">Automated message from {{teacherName}}.</p>
      <p class="meta-line">khalid,</p>
      <p class="meta-line">{{schoolName}}</p>
    </div>
  </div>
</div>
