<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spelling pronunciation review — render harness</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@200;300;400;500;700;800;900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.__err = null;
      window.addEventListener('error', (e) => { window.__err = String((e.error && e.error.stack) || e.message); });
      window.addEventListener('unhandledrejection', (e) => { window.__err = String((e.reason && e.reason.stack) || e.reason); });
    </script>
    <script type="module" src="/__preview__/reviewMain.jsx"></script>
  </body>
</html>
